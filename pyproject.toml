[project]
name = "pentestupgrade"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "StrafeNDestroy", email = "jacobjpadilla@outlook.com" }
]
requires-python = ">=3.13"
dependencies = []

[project.scripts]
pentestupgrade = "pentestupgrade:main"

[build-system]
requires = ["uv_build>=0.11.18,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyrefly>=1.2.0",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
